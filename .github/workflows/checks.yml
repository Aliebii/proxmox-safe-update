name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n proxmox-safe-update
      - name: ShellCheck
        run: shellcheck proxmox-safe-update
      - name: Mock workflow tests
        run: python3 -m unittest discover -s tests -v
